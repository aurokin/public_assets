<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Forever Dungeon Fieldbook</title>
<meta name="description" content="Which dungeon to run in WoW: Forever, which quests to grab first, what earlier work they need, and where to go.">
<style>
:root {
  /* Every text colour is one of these tokens; tests/test_style.py holds each text/background pair to 4.5:1. */
  --paper: #f3eee2; --card: #fffdf8; --ink: #27231c; --muted: #5f574a; --line: #d8cfbb; --soft: #ebe4d3;
  --accent: #2c5aa0; --accent-ink: #ffffff; --accent-soft: #dde7f6;
  --ok: #1d6a3e; --ok-soft: #dcefe2; --on-ok: #ffffff; --warn: #855004; --warn-soft: #f6e8cc; --on-warn: #ffffff;
  --act: #5b4aa8; --act-soft: #e6e1f6;
  --lock: #8a8271; --alli: #2c5aa0; --horde: #a3302c;
  --radius: 10px; --shadow: 0 1px 2px rgba(40, 30, 10, .08), 0 4px 14px rgba(40, 30, 10, .06);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-side="H"] { --accent: #a3302c; --accent-soft: #f6dedc; }
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15130e; --card: #1f1c15; --ink: #ece6d6; --muted: #aea593; --line: #3b3628; --soft: #2a261c;
    --accent: #7fa8e6; --accent-ink: #10131a; --accent-soft: #223149;
    --ok: #6cc391; --ok-soft: #1c3527; --on-ok: #0e2217; --warn: #e0ae5a; --warn-soft: #3a2d14; --on-warn: #2a1c05;
    --act: #a99bef; --act-soft: #2b2647;
    --lock: #7d7565; --alli: #7fa8e6; --horde: #ee8a85;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  }
  html[data-side="H"] { --accent: #ee8a85; --accent-ink: #1c0f0e; --accent-soft: #46211f; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 5rem; scrollbar-gutter: stable; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
body.locked { overflow: hidden; }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.6rem, 4.6vw, 2.2rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.12rem; }
p { margin: .5rem 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dim { color: var(--muted); }
.fine { color: var(--muted); font-size: .86rem; }
.skip { position: absolute; left: -999px; top: 0; background: var(--card); padding: .5rem .8rem; z-index: 50; }
.skip:focus { left: .5rem; top: .5rem; }
.boot { max-width: 60rem; margin: 3rem auto; padding: 0 1rem; color: var(--muted); }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.top-in { max-width: 62rem; margin: 0 auto; padding: .5rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
.brand { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--ink); }
.brand-mark { color: var(--accent); font-size: 1.5rem; line-height: 1; }
.brand-text { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; line-height: 1.1; }
.brand-text small { display: block; font: 600 .68rem/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; margin-left: auto; flex: 1 1 20rem; justify-content: flex-end; }
.fld { display: flex; align-items: center; gap: .35rem; font-size: .8rem; color: var(--muted); }
.fld input, .fld select { height: 2.25rem; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 0 .55rem; font-size: .95rem; color: var(--ink); }
.fld input::placeholder { color: var(--muted); opacity: 1; }
.fld-lv input { width: 4.4rem; }
.fld-search { flex: 1 1 11rem; }
.fld-search input { width: 100%; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-b { border: 0; background: transparent; padding: 0 .75rem; min-height: 2.25rem; font-size: .9rem; color: var(--muted); }
.seg-b + .seg-b { border-left: 1px solid var(--line); }
.seg-b[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg-b:disabled { opacity: .5; cursor: not-allowed; }

main { max-width: 62rem; margin: 0 auto; padding: 1.1rem 1rem 3rem; outline: none; }
.foot { max-width: 62rem; margin: 0 auto; padding: 1rem 1rem 2.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

/* chips */
.chip { display: inline-block; font: 600 .7rem/1 var(--sans); letter-spacing: .02em; padding: .28rem .45rem; border-radius: 999px; background: var(--soft); color: var(--muted); margin-left: .35rem; vertical-align: middle; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.new { background: var(--act-soft); color: var(--act); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.out { background: var(--warn-soft); color: var(--warn); }
.chip.side-a { color: var(--alli); }
.chip.side-h { color: var(--horde); }
.chip.lv, .chip.id { font-family: var(--mono); font-weight: 500; }
.chip.dimchip { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.chip.wing { white-space: normal; }

/* home */
.hero { margin: .4rem 0 1.1rem; }
.hero p { max-width: 44rem; }
.hero .seg { margin-top: .5rem; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.d a { display: grid; grid-template-columns: 4.6rem 1fr; gap: .8rem; align-items: start; padding: .7rem .9rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); color: inherit; text-decoration: none; }
.d a:hover { border-color: var(--accent); }
.d.r-in a { border-left: 5px solid var(--ok); }
/* Outlevelled dungeons step back by losing their card and accent, never by fading the text. */
.d.r-high a { background: var(--paper); border-style: dashed; }
.d.r-high .d-lv, .d.r-high .d-name { color: var(--muted); }
.d.r-high .bar i { background: var(--muted); }
.d-lv { font: 600 1.05rem/1.3 var(--mono); color: var(--accent); padding-top: .1rem; }
.d-main { display: grid; gap: .15rem; min-width: 0; }
.d-name { font: 700 1.1rem/1.25 var(--serif); }
.d-zone, .d-wings { font-size: .85rem; color: var(--muted); }
.d-q { font-size: .9rem; }
.bar { position: relative; display: block; height: 6px; margin: .3rem 0 .15rem; background: var(--soft); border-radius: 3px; }
.bar i { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 3px; opacity: .85; }
.bar.n2 i, .bar.n3 i, .bar.n4 i { opacity: .45; }
.bar b { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1px; background: var(--ink); border-radius: 2px; }

/* dungeon */
.crumb { margin-bottom: .6rem; font-size: .92rem; }
.dh-meta { color: var(--muted); margin: .25rem 0 0; }
.wings { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
.wing-b { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .35rem .8rem; font-size: .88rem; min-height: 2.2rem; }
.wing-b small { color: var(--muted); font-family: var(--mono); }
.wing-b[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wing-b[aria-pressed="true"] small { color: inherit; }
.enter, .about { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; margin: 1rem 0; }
.maps-b { padding: 0 1rem .8rem; }
.enter p { margin: .35rem 0 .2rem; max-width: 46rem; }
.pins, .locs { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: .35rem; }
.pins li.other b { font-weight: 400; color: var(--muted); }
.where { color: var(--muted); }
.xy { font-family: var(--mono); font-size: .92em; color: var(--ink); white-space: nowrap; }
.copy { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; font: 600 .72rem/1 var(--sans); padding: .32rem .5rem; color: var(--accent); white-space: nowrap; min-height: 1.7rem; }
.copy:hover { border-color: var(--accent); }
.notes { margin: 1rem 0; padding: .7rem 1rem .7rem 2rem; background: var(--warn-soft); border-radius: var(--radius); }
.notes li { margin: .2rem 0; }
.tally { margin: 1rem 0 .4rem; font-size: 1.02rem; }

.sec { margin: .9rem 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.sec > summary { list-style: none; display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem; cursor: pointer; border-radius: var(--radius); }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--muted); width: 1em; transition: transform .15s; }
.sec[open] > summary::before { transform: rotate(90deg); }
.sec .count { margin-left: auto; font: 600 .85rem var(--mono); color: var(--muted); background: var(--soft); border-radius: 999px; padding: .1rem .55rem; }
.blurb { color: var(--muted); font-size: .92rem; margin: 0 1rem .5rem; max-width: 46rem; }
.maps-b .blurb { margin-left: 0; }
.zone { font: 700 .78rem/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: .9rem 1rem .1rem; }
.qs { list-style: none; margin: 0; padding: 0 .4rem .4rem; }
.q { display: grid; grid-template-columns: 2.6rem 1fr; gap: .2rem; padding: .6rem .5rem; border-top: 1px solid var(--soft); }
.qs > .q:first-child { border-top: 0; }
.q-body { min-width: 0; display: grid; gap: .15rem; }
.q-head { display: flex; flex-wrap: wrap; align-items: center; row-gap: .25rem; }
.q-title { font: 700 1.02rem/1.3 var(--serif); color: var(--ink); text-decoration-color: var(--line); }
.q-title:hover { color: var(--accent); }
.q-where { font-size: .9rem; }
.q-sum { font-size: .9rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-gate, .gate { font-size: .88rem; font-weight: 600; display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.q-gate .dim { font-weight: 400; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--lock); flex: none; transform: translateY(.02rem); }
.st-ready .q-gate, .st-ready.gate { color: var(--ok); } .st-ready .dot { background: var(--ok); }
.st-done .q-gate, .st-done.gate { color: var(--ok); } .st-done .dot { background: var(--ok); }
.st-active .q-gate, .st-active.gate { color: var(--accent); } .st-active .dot { background: var(--accent); }
.st-blocked .q-gate, .st-prep .q-gate, .st-blocked.gate, .st-prep.gate { color: var(--warn); } .st-blocked .dot, .st-prep .dot { background: var(--warn); }
.st-level .q-gate, .st-level.gate { color: var(--act); } .st-level .dot { background: var(--act); }
.st-excluded .q-gate, .st-excluded.gate { color: var(--muted); }
.q.st-done .q-title { text-decoration: line-through; color: var(--muted); }
.q-tip, .tip { font-size: .9rem; background: var(--accent-soft); border-radius: 8px; padding: .4rem .6rem; margin-top: .2rem; }
.tick { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); font-size: 1.05rem; line-height: 1; display: grid; place-items: center; padding: 0; color: var(--accent-ink); }
.tick:hover { border-color: var(--accent); }
.tick.t1 { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tick.t2 { border-color: var(--ok); background: var(--ok); color: var(--on-ok); }
.link-b { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: .3rem 0; font-size: .9rem; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: .45rem .8rem; font-size: .9rem; min-height: 2.25rem; }
.btn:hover { border-color: var(--accent); }
.btn.danger { color: var(--horde); }
.srcs { margin: 1rem 0; font-size: .9rem; color: var(--muted); }
.srcs summary { cursor: pointer; }
.srcs ul { margin: .4rem 0; padding-left: 1.2rem; }
.sh { margin: 1.2rem 0 .5rem; }
.hits { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }

/* chain maps */
.legend { list-style: none; margin: .5rem 0 .8rem; padding: 0; display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .8rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: .4rem; }
.lg { width: 1.7rem; height: 0; border-top: 2px solid var(--muted); }
.lg-any { border-color: var(--warn); }
.lg-act { border-color: var(--act); border-top-style: dashed; }
.lg-bc { border-top-style: dotted; }
.lg-doc { border-top-style: dashed; }
.lg-mat { border-top: 2px dashed var(--ok); }
.lgn { width: 1rem; height: .75rem; border: 2px solid var(--accent); border-radius: 3px; background: var(--accent-soft); }
.chain { margin: .8rem 0 0; border-top: 1px solid var(--soft); padding-top: .7rem; }
.chain-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .2rem 1rem; margin-bottom: .4rem; }
.chain-h h4 { font-size: 1rem; }
.chain-scroll { overflow: auto; max-width: 100%; padding: .2rem 0 .5rem; -webkit-overflow-scrolling: touch; }
.canvas { position: relative; margin: 0 auto; }
.wires { position: absolute; left: 0; top: 0; pointer-events: none; }
.w { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: .8; }
.w.lit { stroke: var(--ok); opacity: 1; }
.w-any { stroke: var(--warn); }
.w-alt { stroke: var(--warn); stroke-dasharray: 5 4; }
.w-act { stroke: var(--act); stroke-dasharray: 9 4; }
.w-bc { stroke-dasharray: 1.5 4; stroke-linecap: round; }
.w-doc { stroke-dasharray: 5 4; }
.w-mat { stroke: var(--ok); stroke-dasharray: 8 3 2 3; }
.wires marker path { fill: var(--muted); }
.node { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: .1rem; padding: .3rem 1.3rem .3rem .55rem; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); text-decoration: none; font-size: .78rem; line-height: 1.2; }
.node:hover { border-color: var(--accent); z-index: 2; }
.node.target { border-color: var(--accent); background: var(--accent-soft); border-width: 2px; }
.n-t { font-weight: 650; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.n-m { color: var(--muted); font-size: .7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-s { position: absolute; right: .35rem; top: .25rem; font-size: .85rem; }
.n-p { position: absolute; right: .3rem; bottom: .25rem; font: 700 .64rem/1 var(--mono); color: var(--muted); background: var(--soft); border-radius: 4px; padding: .12rem .22rem; }
.n-m { padding-right: .6rem; }
.node.st-done { border-color: var(--ok); background: var(--ok-soft); } .node.st-done .n-s { color: var(--ok); }
.node.st-active { border-color: var(--accent); border-style: dashed; } .node.st-active .n-s { color: var(--accent); }
.node.st-ready { box-shadow: inset 4px 0 0 var(--ok); }
.node.st-blocked, .node.st-prep { box-shadow: inset 4px 0 0 var(--warn); }
.node.st-level { box-shadow: inset 4px 0 0 var(--act); }
.node.st-excluded { border-style: dotted; background: var(--paper); }
.node.st-excluded .n-t { color: var(--muted); font-weight: 500; }
.join { position: absolute; top: -.62rem; left: 50%; transform: translateX(-50%); font: 700 .62rem/1 var(--sans); letter-spacing: .03em; text-transform: uppercase; padding: .16rem .4rem; border-radius: 999px; background: var(--ink); color: var(--paper); white-space: nowrap; z-index: 1; }
.join.j-any { background: var(--warn); color: var(--on-warn); }
.join + .join { left: auto; right: -.4rem; transform: none; }

/* quest sheet */
.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgba(20, 16, 8, .45); }
.sheet-in { position: relative; width: min(36rem, 100%); height: 100%; background: var(--paper); box-shadow: var(--shadow); display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; padding: .9rem 1rem .7rem; background: var(--card); border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 1.35rem; outline: none; }
.sheet-sub { margin: .35rem 0 0; }
.sheet-sub .chip:first-child { margin-left: 0; }
.x { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 2.4rem; height: 2.4rem; font-size: 1.4rem; line-height: 1; flex: none; }
.sheet-b { overflow: auto; padding: .8rem 1rem 2.5rem; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-b section { margin-top: 1.1rem; }
.sheet-b h3 { border-bottom: 1px solid var(--line); padding-bottom: .25rem; margin-bottom: .4rem; }
.sheet-b h4 { font: 700 .8rem/1.2 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: .7rem 0 .2rem; }
.prog { margin: .2rem 0 .5rem; }
.gate { margin: .2rem 0 .6rem; }
.facts { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; margin: .4rem 0; }
.facts dt { font-size: .75rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.lbl { font-size: .8rem; color: var(--muted); margin: .5rem 0 .15rem; }
.lnote { display: block; font-size: .88rem; color: var(--muted); margin-top: .1rem; }
.warnline { color: var(--warn); font-size: .92rem; }
.objs, .steps, .route { margin: .3rem 0; padding-left: 1.3rem; }
.objs li, .steps li, .route li { margin: .15rem 0; }
.req ul { list-style: none; margin: .2rem 0; padding: 0; display: grid; gap: .2rem; }
.req li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .4rem; }
.req p { margin: .1rem 0 .3rem; font-size: .86rem; }
.rq-mark { width: 1.1rem; color: var(--muted); }
.req li.ok .rq-mark { color: var(--ok); }
.req li.ok .ql { color: var(--muted); }
.req .btn { margin-top: .4rem; }
.sheet .chain { border-top: 0; padding-top: 0; }
.ql small { color: var(--muted); }

.about h2 { margin-top: 1.2rem; }
.about p { max-width: 46rem; }
.about code { font-family: var(--mono); background: var(--soft); padding: .1rem .3rem; border-radius: 4px; font-size: .88em; }
.backup { width: 100%; font: .8rem/1.4 var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .5rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; }

.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translate(-50%, 1rem); background: var(--ink); color: var(--paper); padding: .55rem .9rem; border-radius: 8px; font-size: .88rem; max-width: min(92vw, 34rem); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 60; overflow-wrap: anywhere; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 40rem) {
  .top { position: static; }
  html { scroll-padding-top: 1rem; }
  .top-in { padding: .45rem .7rem; }
  .who { justify-content: flex-start; margin-left: 0; }
  .fld-search { flex-basis: 100%; }
  main { padding: .9rem .7rem 3rem; }
  .d a { grid-template-columns: 3.9rem 1fr; gap: .6rem; padding: .65rem .7rem; }
  .q { grid-template-columns: 2.5rem 1fr; }
  .enter, .about { padding: .8rem; }
  .maps-b { padding: 0 .7rem .7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .top, .foot, .sheet, .toast, .copy, .tick, .wings { display: none !important; }
  body { background: white; }
  .sec, .enter, .maps { break-inside: avoid; border-color: gray; }
}

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Forever Dungeon Fieldbook, all dungeons">
      <span class="brand-mark" aria-hidden="true">◈</span>

    { key: 'raid', title: 'Raid and attunement chains', open: false,
      blurb: 'Long campaigns that pass through this dungeon on the way to something bigger.' },
    { key: 'loose', title: 'Objective here, start unknown', open: false,
      blurb: 'These want something from this dungeon, but where the quest starts has not been documented. If you find the giver, grab it.' },
    { key: 'related', title: 'Loosely related', open: false,
      blurb: 'Chain steps, set upgrades and side errands linked to this dungeon. Not things to collect before a normal run.' },
    { key: 'unconfirmed', title: 'Unconfirmed', open: false,
      blurb: 'Listed against this dungeon in the game data, but nobody has confirmed you can actually pick them up. Do not plan around them.' }
  ];

  var SUBTYPE = {
    'set-upgrade': 'Dungeon set upgrade',
    'set-2': 'Dungeon Set 2 chain',
    'loot': 'Uses loot or crafts from here',
    'book-half': 'Book half drops here',
    'scripted': 'Scripted event inside',
    'rep-mats': 'Reputation materials'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  }
  function num(n) { return String(Math.round(n * 10) / 10); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function listText(names, joiner) {

  }

  /* ------------------------------------------------------------------ core */
  function createCore(DATA) {
    var Q = DATA.quests, D = DATA.dungeons;
    var bySlug = {}, edgesIn = {}, edgesOut = {}, edgeKey = {}, member = {}, hay = null;

    function addEdge(from, to, type) {
      from = Number(from); to = Number(to);
      if (!Q[from] || !Q[to] || from === to) return;
      var k = from + '>' + to, old = edgeKey[k];
      if (old) {
        // One connector per pair of quests. A second, different relationship rides along on it; it is never dropped.
        if (old.type === type || (old.also || []).indexOf(type) >= 0) return;
        var roles = [old.type, type].concat(old.also || []).sort(function (a, b) { return EDGE_RANK[a] - EDGE_RANK[b]; });
        old.type = roles[0];
        old.also = roles.slice(1);
        return;
      }
      var e = { from: from, to: to, type: type };
      edgeKey[k] = e;
      (edgesIn[to] = edgesIn[to] || []).push(e);
      (edgesOut[from] = edgesOut[from] || []).push(e);
    }
    Object.keys(Q).forEach(function (id) {
      var q = Q[id];
      (q.all || []).forEach(function (p) { addEdge(p, id, 'all'); });
      (q.any || []).forEach(function (p) { addEdge(p, id, 'any'); });
      (q.act || []).forEach(function (p) { addEdge(p, id, 'act'); });
      (q.doc || []).forEach(function (p) { addEdge(p, id, 'doc'); });
      (q.bc || []).forEach(function (p) { addEdge(p, id, 'bc'); });
    });
    Object.keys(Q).forEach(function (id) {
      var q = Q[id];
      (q.mat || []).forEach(function (c) { addEdge(id, c, 'mat'); });
      if (q.mf) addEdge(q.mf, id, 'mat');
      if (q.altFor) addEdge(id, q.altFor, 'alt');
    });
    D.forEach(function (d) {
      bySlug[d.slug] = d;
      d.quests.forEach(function (m) { (member[m.id] = member[m.id] || []).push({ slug: d.slug, s: m.s, m: m }); });
      d.support.forEach(function (id) { (member[id] = member[id] || []).push({ slug: d.slug, s: 'chain' }); });
    });

    /* Same-title stages are different quests. Number them along their chain so they can be told apart. */
    var part = {};
    (function () {
      var byTitle = {};
      Object.keys(Q).forEach(function (id) { (byTitle[Q[id].t] = byTitle[Q[id].t] || []).push(Number(id)); });
      Object.keys(byTitle).forEach(function (t) {
        var group = byTitle[t], inGroup = {}, anc = {};
        if (group.length < 2) return;
        group.forEach(function (g) { inGroup[g] = 1; });
        group.forEach(function (g) {
          var seen = {}, stack = [g];
          anc[g] = [];
          while (stack.length) {
            (edgesIn[stack.pop()] || []).forEach(function (e) {
              if (e.type === 'bc' || e.type === 'mat' || e.type === 'alt' || seen[e.from]) return;
              seen[e.from] = 1;
              if (inGroup[e.from]) anc[g].push(e.from);
              stack.push(e.from);
            });
          }
        });
        // Depth along the chain, so two alternative versions of one stage share a number.
        var depth = {};
        group.slice().sort(function (a, b) { return anc[a].length - anc[b].length; }).forEach(function (g) {
          depth[g] = 1 + anc[g].reduce(function (m, a) { return Math.max(m, depth[a] || 0); }, 0);
        });
        group.forEach(function (g) {
          var n = depth[g];
          group.forEach(function (o) { if (anc[o].indexOf(g) >= 0) n = Math.max(n, depth[o]); });
          if (n > 1) part[g] = [depth[g], n];

      });
    })();

    function quest(id) { return Q[id] || null; }
    function sideOk(q, f) { return !q.f || q.f === 'B' || !f || q.f === f; }
    function classOk(q, c) { return !c || !q.c || q.c.indexOf(c) >= 0; }
    function eligible(q, P) { return sideOk(q, P.faction) && classOk(q, P.cls); }
    function needLevel(q) { return q.pmin != null ? q.pmin : (q.min != null ? q.min : null); }

    /* A session caches chain answers for one profile + progress snapshot. */
    function session(P) {
      var memo = {}, busy = {};
      function prog(id) { return P.progress[id] || 0; }

      function pick(options) {
        var best = null, bestScore = null;
        options.forEach(function (o) {
          var q = Q[o];
          if (!q) return;
          var score = [eligible(q, P) ? 0 : 1, prog(o) === 1 ? 0 : 1, plan(o).length, Number(o)];
          var better = !bestScore;
          for (var i = 0; !better && i < score.length; i++) {
            if (score[i] !== bestScore[i]) { better = score[i] < bestScore[i]; break; }
          }
          if (better) { best = Number(o); bestScore = score; }
        });
        return best;
      }

      /* Everything still to do for this quest, earliest first, the quest itself last. */
      function plan(id) {
        id = Number(id);
        if (memo[id]) return memo[id];
        if (busy[id]) return [];
        busy[id] = 1;
        var q = Q[id], out = [], seen = {};
        function add(list) { list.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } }); }
        if (q && prog(id) !== 2) {
          if (prog(id) !== 1) {
            (q.all || []).forEach(function (p) { add(plan(p)); });
            if (q.any && q.any.length && !q.any.some(function (p) { return prog(p) === 2; })) {
              var choice = pick(q.any);
              if (choice != null) add(plan(choice));
            }
            (q.act || []).forEach(function (p) { add(plan(p)); });
            (q.doc || []).forEach(function (p) { add(plan(p)); });
          }
          add([id]);
        }

        memo[id] = out;
        return out;
      }

      function gate(id) {
        var q = Q[id], st = prog(id);
        if (!q) return { state: 'unknown' };
        if (st === 2) return { state: 'done' };
        if (st === 1) return { state: 'active' };
        var taken = (q.x || []).filter(function (x) { return prog(x) >= 1; });
        if (taken.length) return { state: 'excluded', by: taken };
        var miss = { all: [], any: [], act: [], doc: [] };
        (q.all || []).forEach(function (p) { if (prog(p) !== 2) miss.all.push(p); });
        if (q.any && q.any.length && !q.any.some(function (p) { return prog(p) === 2; })) miss.any = q.any.slice();
        (q.act || []).forEach(function (p) { if (prog(p) !== 1) miss.act.push(p); });
        (q.doc || []).forEach(function (p) { if (prog(p) !== 2) miss.doc.push(p); });
        if (miss.all.length || miss.any.length || miss.act.length) return { state: 'blocked', miss: miss };
        if (miss.doc.length) return { state: 'prep', miss: miss };
        var need = needLevel(q);
        if (P.level && need != null && P.level < need) return { state: 'level', need: need };
        return { state: 'ready' };
      }

      return { P: P, prog: prog, plan: plan, gate: gate, pick: pick };
    }

    /* The shared map: every listed target plus all earlier work, as one graph. */
    function chain(targets, P) {
      var inSet = {}, order = [], queue = [];

        var anyAll = ins.filter(function (e) { return e.type === 'any'; });
        var anyOk = anyAll.filter(function (e) { return eligible(Q[e.from], P); });
        ins.forEach(function (e) {
          var pq = Q[e.from];
          if (!sideOk(pq, P.faction)) return;
          if (e.type === 'any' && anyOk.length && anyOk.indexOf(e) < 0) return;
          if (e.type !== 'any' && P.cls && !classOk(pq, P.cls) && classOk(q, P.cls)) return;

        (edgesOut[id] || []).forEach(function (e) {

        });
      }

      order.forEach(function (id) {
        (edgesIn[id] || []).forEach(function (e) { if (inSet[e.from]) edges.push(e); });
      });

    }

      var parent = {};
      function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }

      graph.nodes.forEach(function (n) {

      graph.edges.forEach(function (e) { groups[find(e.from)].edges.push(e); });
      return out;
    }

    /* ---- drawing aid: fold away connectors that a longer route already proves ----

       this only decides which lines a map has to draw.

       so a choice of several never becomes a "must" because a faction or class filter left one on screen. */

      if (e.type !== 'any' || !q.any || !q.any.length) return false;
      return q.any.every(function (p) { return Number(p) === from; });
    }

    /* A must-finish connector A -> C is folded when the same drawing already holds A -> ... -> C in

    function wingToken(name) {

    }

      if (!sideOk(q, P.faction)) return null;

      d.quests.forEach(function (m) {

      lists.related = lists.related.filter(function (m) { return !covered[m.id]; });
      return { d: d, lists: lists };
    }

    function summary(d, S) {
      var out = { total: 0, ready: 0, active: 0, done: 0, waiting: 0, level: 0 };
      d.prep[S.P.faction].forEach(function (id) {
        if (!classOk(Q[id], S.P.cls)) return;
        out.total++;
        var g = S.gate(id).state;

        else if (g === 'ready') out.ready++;
        else if (g === 'level') out.level++;

      });
      return out;
    }

    /* The home card's headline: the quests a player of this faction and class can actually take for this
       dungeon, each counted once. It reads the dungeon's own list (pick-ups, quests that start inside or
       from an item, follow-ups, class, profession, raid and event quests) and nothing from chain support.
       Left out, though still shown on the dungeon page: lead-in steps and loosely related extras,
       unconfirmed entries, objectives with no known start, and scripted events nobody accepts.
       Level, progress and wing never change it: it is a total, not what is ready right now.
       A quest whose side is recorded as not known (f: null) is not promised to either faction here;

        var q = Q[m.id];
        if (!q || !eligible(q, P)) return;
        if (q.f === null && P.faction) return;
        if (m.s === 'unconfirmed' || m.s === 'loose' || m.st === 'scripted' || looselyRelated(m)) return;

    }

    }

      var mine = list.filter(function (l) { return !CITY_SIDE[l.z] || CITY_SIDE[l.z] === P.faction; });

    }

    function search(text, limit) {

      if (!words.length) return { dungeons: [], quests: [] };
      if (!hay) {

          var q = Q[id], bits = [id, q.t].concat(q.al || []);
          (q.from || []).concat(q.to || []).forEach(function (l) { bits.push(l.n); if (l.z) bits.push(l.z); });
          return { id: Number(id), text: bits.join(' ').toLowerCase(), title: q.t.toLowerCase() };
        });
      }
      function hit(s) { return words.every(function (w) { return s.indexOf(w) >= 0; }); }
      var qs = hay.filter(function (h) { return hit(h.text); });
      qs.sort(function (a, b) {
        var at = hit(a.title) ? 0 : 1, bt = hit(b.title) ? 0 : 1;
        var am = member[a.id] && member[a.id].some(function (x) { return x.s !== 'chain'; }) ? 0 : 1;
        var bm = member[b.id] && member[b.id].some(function (x) { return x.s !== 'chain'; }) ? 0 : 1;
        return at - bt || am - bm || a.title.localeCompare(b.title) || a.id - b.id;
      });
      return {
        dungeons: D.filter(function (d) { return hit((d.name + ' ' + d.zone).toLowerCase()); }),
        quests: qs.slice(0, limit || 60).map(function (h) { return h.id; }),
        more: Math.max(0, qs.length - (limit || 60))
      };
    }

    function srcUrl(s) {
      var m = /^(\d+):(.*)$/.exec(s);
      return m ? DATA.srcPrefix[Number(m[1])] + m[2] : s;
    }

    return {
      data: DATA, quest: quest, dungeons: D, dungeon: function (s) { return bySlug[s] || null; },
      part: function (id) { return part[id] || null; },
      member: function (id) { return member[id] || []; },
      edgesIn: function (id) { return edgesIn[id] || []; }, edgesOut: function (id) { return edgesOut[id] || []; },
      sideOk: sideOk, classOk: classOk, eligible: eligible, needLevel: needLevel,
      session: session, chain: chain, components: components, mustFinish: mustFinish, simplify: simplify,
      dungeonView: dungeonView, sectionFor: sectionFor,
      summary: summary, playerQuests: playerQuests, questTotal: questTotal, rangeState: rangeState, waypoint: waypoint, pickups: pickups, search: search,
      srcUrl: srcUrl, wingToken: wingToken, inWing: inWing
