  }

  /* ---------------------------------------------------------------- layout */
  function layoutGraph(nodeIds, edges, o) {
    o = o || {};
    var W = o.w || 168, H = o.h || 60, GX = o.gx || 16, GY = o.gy || 38, PAD = o.pad || 10, DW = 14;
    var ins = {}, outs = {}, layer = {}, mark = {};
    nodeIds.forEach(function (n) { ins[n] = []; outs[n] = []; });
    var E = edges.filter(function (e) { return ins[e.to] && outs[e.from] && e.from !== e.to; })
      .map(function (e) { return { from: e.from, to: e.to, type: e.type, also: e.also, cut: false }; });
    E.forEach(function (e) { ins[e.to].push(e); outs[e.from].push(e); });

    function depth(n) {
      if (layer[n] != null) return layer[n];
      if (mark[n]) return -1;
      mark[n] = 1;
      var dmax = 0;
      ins[n].forEach(function (e) {
        if (e.cut) return;
        var pd = depth(e.from);
        if (pd < 0) { e.cut = true; return; }
        if (pd + 1 > dmax) dmax = pd + 1;
      });
      mark[n] = 0;
      layer[n] = dmax;
      return dmax;
    }
    nodeIds.forEach(depth);
    // Pull each step down next to the earliest thing it unlocks: shorter edges, tidier chains.
    nodeIds.slice().sort(function (a, b) { return layer[b] - layer[a]; }).forEach(function (n) {
      var lows = outs[n].filter(function (e) { return !e.cut; }).map(function (e) { return layer[e.to]; });
      if (lows.length) layer[n] = Math.min.apply(null, lows) - 1;
    });
    var minL = Math.min.apply(null, nodeIds.map(function (n) { return layer[n]; }));
    nodeIds.forEach(function (n) { layer[n] -= minL; });

    var rows = [], info = {};
    function put(key, l, dummy) {
      (rows[l] = rows[l] || []).push(key);
      info[key] = { layer: l, dummy: dummy, up: [], down: [], x: 0, w: dummy ? DW : W };
    }
    nodeIds.forEach(function (n) { put('n' + n, layer[n], false); });
    var dn = 0;
    E.forEach(function (e) {
      if (e.cut) { e.pts = null; return; }
      var prev = 'n' + e.from, chainKeys = [];
      for (var l = layer[e.from] + 1; l < layer[e.to]; l++) {
        var k = 'd' + (dn++);
        put(k, l, true);
        info[prev].down.push(k); info[k].up.push(prev);
        chainKeys.push(k); prev = k;
      }
      info[prev].down.push('n' + e.to); info['n' + e.to].up.push(prev);
      e.mid = chainKeys;
    });
    for (var i = 0; i < rows.length; i++) rows[i] = rows[i] || [];

    function bary(row, side) {
      var pos = {};
      rows.forEach(function (r) { r.forEach(function (k, idx) { pos[k] = idx; }); });
      var val = {};
      row.forEach(function (k, idx) {
        var nb = info[k][side];
        val[k] = nb.length ? nb.reduce(function (s, x) { return s + pos[x]; }, 0) / nb.length : idx;
      });
      var withIdx = row.map(function (k, idx) { return { k: k, v: val[k], i: idx }; });
      withIdx.sort(function (a, b) { return a.v - b.v || a.i - b.i; });
      return withIdx.map(function (x) { return x.k; });
    }
    for (var sweep = 0; sweep < 6; sweep++) {
      var r;
      for (r = 1; r < rows.length; r++) rows[r] = bary(rows[r], 'up');
      for (r = rows.length - 2; r >= 0; r--) rows[r] = bary(rows[r], 'down');
    }

    function sep(a, b) { return (info[a].w + info[b].w) / 2 + GX; }
    rows.forEach(function (row) {
      var x = 0;
      row.forEach(function (k, idx) { if (idx) x += sep(row[idx - 1], k); info[k].x = x; });
    });
    function settle(row, side) {
      if (!row.length) return;
      var want = row.map(function (k) {
        var nb = info[k][side];
        return nb.length ? nb.reduce(function (s, x) { return s + info[x].x; }, 0) / nb.length : info[k].x;
      });
      var fwd = [], bwd = [], idx;
      for (idx = 0; idx < row.length; idx++) fwd[idx] = idx ? Math.max(want[idx], fwd[idx - 1] + sep(row[idx - 1], row[idx])) : want[idx];
      for (idx = row.length - 1; idx >= 0; idx--) bwd[idx] = idx < row.length - 1 ? Math.min(want[idx], bwd[idx + 1] - sep(row[idx], row[idx + 1])) : want[idx];
      row.forEach(function (k, j) { info[k].x = (fwd[j] + bwd[j]) / 2; });
    }
    for (var pass = 0; pass < 8; pass++) {
      var rr;
      for (rr = 1; rr < rows.length; rr++) settle(rows[rr], 'up');
      for (rr = rows.length - 2; rr >= 0; rr--) settle(rows[rr], 'down');
    }
    var left = Infinity, right = -Infinity;
    Object.keys(info).forEach(function (k) {
      left = Math.min(left, info[k].x - info[k].w / 2);
      right = Math.max(right, info[k].x + info[k].w / 2);
    });
    var pos = {};
    function cx(k) { return info[k].x - left + PAD; }
    function top(k) { return PAD + info[k].layer * (H + GY); }
    nodeIds.forEach(function (n) { pos[n] = { x: Math.round(cx('n' + n) - W / 2), y: top('n' + n), layer: info['n' + n].layer }; });
    var paths = [];
    E.forEach(function (e) {
      if (e.cut) return;
      var pts = [[cx('n' + e.from), top('n' + e.from) + H]];
      e.mid.forEach(function (k) { pts.push([cx(k), top(k)]); pts.push([cx(k), top(k) + H]); });
      pts.push([cx('n' + e.to), top('n' + e.to)]);
      var dstr = 'M' + num(pts[0][0]) + ' ' + num(pts[0][1]);
      for (var j = 1; j < pts.length; j++) {
        var a = pts[j - 1], b = pts[j];
        if (a[0] === b[0]) { dstr += 'L' + num(b[0]) + ' ' + num(b[1]); continue; }
        var k2 = (b[1] - a[1]) / 2;
        dstr += 'C' + num(a[0]) + ' ' + num(a[1] + k2) + ' ' + num(b[0]) + ' ' + num(b[1] - k2) + ' ' + num(b[0]) + ' ' + num(b[1]);
      }
      paths.push({ d: dstr, type: e.type, also: e.also || [], from: e.from, to: e.to });
    });
    return {
      w: Math.ceil(right - left + PAD * 2), h: PAD * 2 + rows.length * H + (rows.length - 1) * GY,
      nodeW: W, nodeH: H, pos: pos, paths: paths, layers: rows.length
    };
  }

  /* ------------------------------------------------------------------- app */
  function createApp(DATA, env) {
    env = env || {};
    var core = createCore(DATA);
    var state = {
      faction: 'A', level: null, cls: '', progress: {},
      route: { view: 'home' }, sheet: null, search: '',
      open: {}, wing: {}, mapAll: {}, homeFilter: 'all'
    };
    var S = null;

    function load() {
      try {
        var raw = env.storage && env.storage.getItem(STORE_KEY);
        if (!raw) return;
        applySaved(JSON.parse(raw));
      } catch (e) { /* a broken save must never block the page */ }
    }
    function applySaved(o) {
      if (!o || typeof o !== 'object') return false;
      if (o.faction === 'A' || o.faction === 'H') state.faction = o.faction;
      var lv = parseInt(o.level, 10);
      state.level = lv >= 1 && lv <= 60 ? lv : null;
      state.cls = CLASSES.indexOf(o.cls) >= 0 ? o.cls : '';
      var p = {};
      if (o.progress && typeof o.progress === 'object') {
        Object.keys(o.progress).forEach(function (id) {
          var v = o.progress[id];
          if (core.quest(id) && (v === 1 || v === 2)) p[id] = v;
        });
      }
      state.progress = p;
      return true;
    }
    function snapshot() { return { v: 1, faction: state.faction, level: state.level, cls: state.cls, progress: state.progress }; }
    function save() {
      try { if (env.storage) env.storage.setItem(STORE_KEY, JSON.stringify(snapshot())); } catch (e) { /* private mode */ }
    }
    function profile() { return { faction: state.faction, level: state.level, cls: state.cls, progress: state.progress }; }
    function sess() { if (!S) S = core.session(profile()); return S; }
    function dirty() { S = null; }

    /* ---- routing ---- */
    function parseHash(hash) {
      var parts = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(function (p) {
        try { return decodeURIComponent(p); } catch (e) { return p; }
      });
      var route = { view: 'home' }, sheet = null, i = 0;
      if (parts[0] === 'd' && core.dungeon(parts[1])) { route = { view: 'dungeon', slug: parts[1] }; i = 2; }
      else if (parts[0] === 'about') { route = { view: 'about' }; i = 1; }
      if (parts[i] === 'q' && core.quest(parts[i + 1])) sheet = Number(parts[i + 1]);
      return { route: route, sheet: sheet };
    }
    function baseHash() {
      if (state.route.view === 'dungeon') return '#/d/' + state.route.slug;
      if (state.route.view === 'about') return '#/about';
      return '#/';
    }
    function questHref(id) { return (baseHash() === '#/' ? '#' : baseHash()) + '/q/' + id; }
    function setRoute(hash) {
      var r = parseHash(hash);
      var changed = r.route.view !== state.route.view || r.route.slug !== state.route.slug;
      state.route = r.route;
      state.sheet = r.sheet;
      if (changed) state.search = '';
      return { viewChanged: changed };
    }

    /* ---- actions ---- */
    function dispatch(act, a) {
      a = a || {};
      var id;
      switch (act) {
        case 'faction':
          if (a.v === 'A' || a.v === 'H') { state.faction = a.v; dirty(); save(); }
          break;
        case 'level':
          var lv = parseInt(a.v, 10);
          state.level = lv >= 1 && lv <= 60 ? lv : null;
          dirty(); save();
          break;
        case 'cls':
          state.cls = CLASSES.indexOf(a.v) >= 0 ? a.v : '';
          dirty(); save();
          break;
        case 'search':
          state.search = String(a.v || '');
          break;
        case 'cycle':
          id = Number(a.id);
          if (core.quest(id)) setProgress(id, ((state.progress[id] || 0) + 1) % 3);
          break;
        case 'set-prog':
          id = Number(a.id);
          if (core.quest(id)) setProgress(id, Number(a.v));
          break;
        case 'mark-earlier':
          id = Number(a.id);
          if (core.quest(id)) {
            sess().plan(id).forEach(function (x) { if (x !== id) state.progress[x] = 2; });
            dirty(); save();
          }
          break;
        case 'wing':
          state.wing[a.slug] = a.v || '';
          break;
        case 'map-all':
          state.mapAll[a.slug] = !state.mapAll[a.slug];
          break;
        case 'home-filter':
          state.homeFilter = a.v === 'range' ? 'range' : 'all';
          break;
        case 'toggle':
          state.open[a.key] = !!a.open;
          break;
        case 'reset':
          state.progress = {}; dirty(); save();
          break;
        case 'import':
          try {
            var ok = applySaved(JSON.parse(a.text));
            dirty(); save();
            return { ok: ok };
          } catch (e) { return { ok: false }; }
      }
      return { ok: true };
    }
    function setProgress(id, v) {
      if (v === 1 || v === 2) state.progress[id] = v; else delete state.progress[id];
      dirty(); save();
    }

    /* ---- small pieces ---- */
    function title(id) {
      var q = core.quest(id), p = core.part(id);
      if (!q) return 'Quest ' + id;
      return q.t + (p ? ' (' + p[0] + '/' + p[1] + ')' : '');
    }
    function partChip(id) {
      var p = core.part(id);
      return p ? '<span class="chip part">Part ' + p[0] + ' of ' + p[1] + '</span>' : '';
    }
    function qlink(id) {
      return '<a class="ql" href="' + questHref(id) + '">' + esc(title(id)) + '</a>';
    }
    function sideChip(q) {
      if (q.f === 'A') return '<span class="chip side-a">Alliance</span>';
      if (q.f === 'H') return '<span class="chip side-h">Horde</span>';
      if (!q.f) return '<span class="chip warn">Faction unknown</span>';
      return '';
    }
    function copyBtn(loc, fk) {
      var w = core.waypoint(loc);
      if (!w) return '';
      return '<button type="button" class="copy" data-act="copy" data-text="' + esc(w) + '" data-fk="' + esc(fk) + '"' +
        ' title="' + esc(w) + '" aria-label="Copy waypoint for ' + esc(loc.n || loc.label) + '">Copy /way</button>';
    }
    function place(loc) {
      if (loc.in === 1) return 'inside ' + esc(loc.z || 'the dungeon') + (loc.sz ? ', ' + esc(loc.sz) : '');
      var z = esc(loc.z || '');
      if (loc.sz) z = esc(loc.sz) + (z ? ', ' + z : '');
      if (loc.x != null) return (z ? z + ' ' : '') + '<span class="xy">' + num(loc.x) + ', ' + num(loc.y) + '</span>';
      return z ? z + ' <span class="dim">(no pin)</span>' : '<span class="dim">location not documented</span>';
    }
    function kindWord(loc) { return loc.k === 'item' ? 'item' : (loc.k === 'object' ? 'object' : ''); }
    function locHtml(loc, fk) {
      var kw = kindWord(loc);
      return '<span class="loc"><b>' + esc(loc.n) + '</b>' + (kw ? ' <span class="dim">(' + kw + ')</span>' : '') +
        ' <span class="where">' + place(loc) + '</span> ' + copyBtn(loc, fk) + '</span>';
    }
    /* Same contact, same spot. A giver who moves (Alba to the Deadmines exit) is a different hand-in. */
    function sameLoc(a, b) {
      if (!a || !b || a.n !== b.n || a.z !== b.z || (a.in || 0) !== (b.in || 0)) return false;
      if ((a.x == null) !== (b.x == null)) return false;
      return a.x == null || (a.m === b.m && Math.abs(a.x - b.x) <= 3 && Math.abs(a.y - b.y) <= 3);
    }

    function readyText(q, ctx) {
      var first = (q.from || [])[0];
      if (ctx === 'unconfirmed') return 'Not confirmed as something you can pick up';
      if (q.start || (first && first.k === 'item')) return 'Starts when you have the item';
      if (!first) return 'Where it starts is not documented';
      if (first.in === 1) return 'Pick up inside';
      return q.ru ? 'No earlier steps on record' : 'Ready to pick up';
    }
    function gateText(id, g, ctx) {
      var q = core.quest(id), names;
      function nm(list, cap) {
        var t = list.slice(0, cap).map(title);
        if (list.length > cap) t.push((list.length - cap) + ' more');
        return t;
      }
      switch (g.state) {
        case 'done': return 'Done';
        case 'active': return 'In your log';
        case 'ready': return readyText(q, ctx);
        case 'level': return 'Pick up from level ' + g.need;
        case 'excluded': return 'Locked out: you chose ' + listText(nm(g.by, 2));
        case 'prep': return 'Guides say first: ' + listText(nm(g.miss.doc, 3));
        case 'blocked':
          names = [];
          if (g.miss.all.length) names.push(listText(nm(g.miss.all, 3)));
          if (g.miss.any.length) {
            var mine = g.miss.any.filter(function (x) { return core.eligible(core.quest(x), sess().P); });
            if (!mine.length) mine = g.miss.any;
            var same = mine.every(function (x) { return title(x) === title(mine[0]); });
            names.push(mine.length === 1 ? title(mine[0]) : same ? title(mine[0]) + ' (either version)' : 'one of ' + listText(nm(mine, 3), 'or'));
          }
          if (g.miss.act.length) names.push('keep ' + listText(nm(g.miss.act, 2)) + ' in your log');
          return 'First: ' + names.join('; ');
      }
      return '';
    }
    var STATE_WORD = { done: 'Done', active: 'In log', ready: 'Ready', level: 'Level', blocked: 'Earlier work', prep: 'Earlier work', excluded: 'Locked out' };

    function cycleBtn(id, fk) {
      var st = state.progress[id] || 0;
      var label = ['Not started', 'In your log', 'Done'][st], next = ['in your log', 'done', 'not started'][st];
      return '<button type="button" class="tick t' + st + '" data-act="cycle" data-id="' + id + '" data-fk="' + esc(fk) + '"' +
        ' aria-label="' + esc(title(id)) + ': ' + label + '. Mark ' + next + '." title="' + label + ' (click to mark ' + next + ')">' +
        '<span aria-hidden="true">' + ['', '◐', '✓'][st] + '</span></button>';
    }

    function wingLabel(w) {
      return w.map(function (x) { return WING_SHORT[x] || x; }).join(' + ');
    }
    function memberChips(m, d) {
      var out = [];
      if (m.w) out.push('<span class="chip wing">' + esc(wingLabel(m.w)) + '</span>');
      if (m.ol === 'approach') out.push('<span class="chip out">Outside the portal</span>');
      else if (m.ol === 'instance_and_approach' || m.ol === 'approach_and_instance') out.push('<span class="chip out">Inside and outside the portal</span>');
      else if (m.ol === 'cross_dungeon') out.push('<span class="chip">Spans several dungeons</span>');
      else if (m.ol === 'instance_material') out.push('<span class="chip">Needs materials from here</span>');
      else if (m.ol === 'world' && m.s === 'inside') out.push('<span class="chip">Hand in outside</span>');
      if (m.pg === 'event') out.push('<span class="chip">Offered after a boss or event</span>');
      if (m.pg === 'rescue') out.push('<span class="chip">Offered after the timed rescue</span>');
      if (m.st && SUBTYPE[m.st]) out.push('<span class="chip">' + SUBTYPE[m.st] + '</span>');
      if (m.ph === 'in' && m.s !== 'inside') out.push('<span class="chip">Starts inside</span>');
      if (m.ph === 'post' && m.s !== 'after') out.push('<span class="chip">After the run</span>');
      return out.join('');
    }

    function questRow(id, m, d, ctx) {
      var q = core.quest(id), g = sess().gate(id), P = sess().P;
      var fk = (ctx || 'r') + id;
      var from = core.pickups(q, P), first = from[0];
      var where;
      if (!first && q.start) where = 'Starts from the item <b>' + esc(q.start.join(', ')) + '</b>';
      else if (!first) where = '<span class="dim">Giver not documented</span>';
      else if (first.k === 'item') where = 'Starts from the item <b>' + esc(first.n) + '</b>' + (first.in === 1 ? ', found inside' : '');
      else if (from.length > 1) where = locHtml(first, fk + 'w') + ' <span class="dim">+' + (from.length - 1) + ' more</span>';
      else where = locHtml(first, fk + 'w');
      var steps = g.state === 'blocked' || g.state === 'prep' ? sess().plan(id).length - 1 : 0;
      var chips = partChip(id);
      if (q.lv != null) chips += '<span class="chip lv" title="Quest level">Lv ' + q.lv + '</span>';
      if (q.c) chips += '<span class="chip cls">' + esc(q.c.join(' / ')) + '</span>';
      if (q.race) chips += '<span class="chip warn">' + esc(q.race.replace('Not offered to ', 'Not for ').replace(' characters.', '')) + '</span>';
      if (m) chips += memberChips(m, d);
      if (q.rep) chips += '<span class="chip">Repeatable</span>';
      var sum = q.sl || q.ot || (q.obj || []).join(' · ');
      var look = g.state === 'ready' && (ctx === 'unconfirmed' || (!first && !q.start)) ? 'excluded' : g.state;
      return '<li class="q st-' + look + '">' + cycleBtn(id, fk + 't') +
        '<div class="q-body">' +
        '<div class="q-head"><a class="q-title" href="' + questHref(id) + '" data-fk="' + fk + 'a">' + esc(q.t) + '</a>' + chips + '</div>' +
        '<div class="q-where">' + where + '</div>' +
        (sum ? '<div class="q-sum">' + esc(sum) + '</div>' : '') +
        '<div class="q-gate"><span class="dot" aria-hidden="true"></span>' + esc(gateText(id, g, ctx)) +
        (steps > 1 ? ' <span class="dim">· ' + plural(steps, 'earlier step') + ' in all</span>' : '') + '</div>' +
        (q.tip ? '<div class="q-tip">' + esc(q.tip) + '</div>' : '') +
        '</div></li>';
    }

    /* ---- chain maps ---- */
    /* What a map draws for one chain: every quest, minus connectors a longer must-finish route already
       proves. A folded connector comes back the moment that route stops proving it for this player:
       a step along it is started or done while the folded requirement is not. */
    function drawn(comp) {
      var Sx = sess(), folded = [], back = [];
      core.simplify(comp).hidden.forEach(function (h) {
        var open = Sx.prog(h.to) === 0 && Sx.prog(h.from) !== 2 && h.via.some(function (x) { return Sx.prog(x) >= 1; });
        (open ? back : folded).push(h);
      });
      var skip = folded.map(function (h) { return h.edge; });
      return {
        nodes: comp.nodes, folded: folded, back: back,
        edges: skip.length ? comp.edges.filter(function (e) { return skip.indexOf(e) < 0; }) : comp.edges
      };
    }

    function chainCard(comp, targets, slug, n) {
      var Sx = sess(), isTarget = {};
      targets.forEach(function (t) { isTarget[t] = 1; });
      var view = drawn(comp);
      var lay = layoutGraph(view.nodes, view.edges);
      var ends = comp.nodes.filter(function (x) {
        return isTarget[x] && !comp.edges.some(function (e) { return e.from === x && isTarget[e.to]; });
      });
      if (!ends.length) ends = comp.nodes.filter(function (x) { return isTarget[x]; });
      var doneN = comp.nodes.filter(function (x) { return Sx.prog(x) === 2; }).length;
      var uid = 'm' + (slug || 'sheet') + n;
      var svg = '<svg class="wires" width="' + lay.w + '" height="' + lay.h + '" viewBox="0 0 ' + lay.w + ' ' + lay.h + '" aria-hidden="true" focusable="false">' +
        '<defs><marker id="' + uid + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker></defs>';
      lay.paths.forEach(function (p) {
        var lit = Sx.prog(p.from) === 2 || (p.type === 'act' && Sx.prog(p.from) === 1);
        var cls = (lit ? ' lit' : '') + '" d="' + p.d + '"';
        if (!p.also.length) { svg += '<path class="w w-' + p.type + cls + ' marker-end="url(#' + uid + ')"/>'; return; }
        // Two relationships between the same two quests: one connector, a strand in each relationship's own style.
        var gap = 5, x0 = -gap * p.also.length / 2;
        svg += '<path class="w w-' + p.type + cls + ' transform="translate(' + num(x0) + ' 0)" marker-end="url(#' + uid + ')"/>';
        p.also.forEach(function (t, i) {
          svg += '<path class="w w-' + t + cls + ' transform="translate(' + num(x0 + gap * (i + 1)) + ' 0)"/>';
        });
      });
      svg += '</svg>';
      var nodes = '';
      comp.nodes.slice().sort(function (a, b) { return lay.pos[a].layer - lay.pos[b].layer || lay.pos[a].x - lay.pos[b].x; }).forEach(function (id) {
        var q = core.quest(id), g = Sx.gate(id), p = lay.pos[id];
        // Join badges count the connectors actually drawn into this box, so the label always matches the picture.
        var insHere = view.edges.filter(function (e) { return e.to === id; });
        var nAll = insHere.filter(core.mustFinish).length;
        var nAny = insHere.filter(function (e) { return e.type === 'alt' || (e.type === 'any' && !core.mustFinish(e)); }).length;
        var badge = '';
        if (nAll > 1) badge += '<span class="join j-all">needs all ' + nAll + '</span>';
        if (nAny > 1) badge += '<span class="join j-any">any 1 of ' + nAny + '</span>';
        var first = (q.from || [])[0], meta = [];
        if (isTarget[id] && slug) meta.push('this dungeon');
        else if (isTarget[id]) meta.push('this quest');
        else {
          var other = core.member(id).filter(function (x) { return x.s !== 'chain' && x.s !== 'leadin' && x.slug !== slug; })[0];
          if (first && first.in === 1) meta.push('inside ' + first.z);
          else if (other && !first) meta.push(core.dungeon(other.slug).name);
          else if (first && first.z) meta.push(first.z);
          else if (first && first.k === 'item') meta.push('item drop');
        }
        if (q.lv != null) meta.push('Lv ' + q.lv);
        if (q.c) meta.push(q.c.length > 2 ? q.c.length + ' classes' : q.c.join('/'));
        var needs = [];
        if (q.all) needs.push((q.all.length > 1 ? 'needs all of: ' : 'needs: ') + q.all.map(title).join(', '));
        if (q.any) needs.push(q.any.length > 1 ? 'needs any one of: ' + q.any.map(title).join(', ') : 'needs: ' + title(q.any[0]));
        if (q.act) needs.push('needs in your log: ' + q.act.map(title).join(', '));
        var jobFor = insHere.filter(function (e) { return e.type === 'mat' || (e.also || []).indexOf('mat') >= 0; });
        if (jobFor.length) needs.push('side job for: ' + jobFor.map(function (e) { return title(e.from); }).join(', '));
        nodes += '<a class="node st-' + g.state + (isTarget[id] ? ' target' : '') + '" href="' + questHref(id) + '" data-fk="' + uid + 'n' + id + '"' +
          ' style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + lay.nodeW + 'px;height:' + lay.nodeH + 'px"' +
          ' aria-label="' + esc(title(id) + '. ' + STATE_WORD[g.state] + '. ' + needs.join('; ')) + '">' +
          badge + '<span class="n-t">' + esc(q.t) + '</span><span class="n-m">' + esc(meta.join(' · ')) + '</span>' +
          (core.part(id) ? '<span class="n-p" aria-hidden="true">' + core.part(id).join('/') + '</span>' : '') +
          '<span class="n-s" aria-hidden="true">' + ({ done: '✓', active: '◐' }[g.state] || '') + '</span></a>';
      });
      return '<section class="chain">' +
        '<header class="chain-h"><h4>Toward ' + esc(ends.length > 3 ? ends.slice(0, 3).map(title).join(', ') + ' and ' + (ends.length - 3) + ' more' : listText(ends.map(title))) + '</h4>' +
        '<span class="dim">' + plural(comp.nodes.length, 'quest') + (doneN ? ' · ' + doneN + ' done' : '') + '</span></header>' +
        '<div class="chain-scroll" tabindex="0" role="group" aria-label="Chain map, scrolls sideways">' +
        '<div class="canvas" style="width:' + lay.w + 'px;height:' + lay.h + 'px">' + svg + nodes + '</div></div></section>';
    }

    function legend(targetLabel) {
      return '<ul class="legend" aria-label="Map key">' +
        '<li><span class="lg lg-all"></span>must finish first</li>' +
        '<li><span class="lg lg-any"></span>any one of these</li>' +
        '<li><span class="lg lg-act"></span>must still be in your log</li>' +
        '<li><span class="lg lg-bc"></span>optional lead-in</li>' +
        '<li><span class="lg lg-doc"></span>guides say do first</li>' +
        '<li><span class="lg lg-mat"></span>side job for materials</li>' +
        '<li><span class="lgn target"></span>' + (targetLabel || 'quest for this dungeon') + '</li>' +
        '</ul>';
    }

    /* Chains feeding the "before you go" list come first; they are the ones to plan around. */
    function chains(targets, firstIds) {
      if (!targets.length) return [];
      var graph = core.chain(targets, sess().P), lead = {};
      (firstIds || []).forEach(function (x) { lead[x] = 1; });
      var comps = core.components(graph).filter(function (c) { return c.nodes.length > 1; });
      function rank(c) { return c.nodes.some(function (n) { return lead[n]; }) ? 0 : 1; }
      return comps.sort(function (a, b) { return rank(a) - rank(b) || a.nodes.length - b.nodes.length; });
    }
    function chainMaps(targets, slug, firstIds) {
      var comps = chains(targets, firstIds);
      return { html: comps.map(function (c, i) { return chainCard(c, targets, slug, i); }).join(''), count: comps.length };
    }
    /* Which quests the dungeon page maps: the run plan by default, everything listed on request. */
    function mapTargets(v) {
      var main = [], all = [];
      SECTIONS.forEach(function (sec) {
        v.lists[sec.key].forEach(function (m) {
          if (sec.key === 'unconfirmed') return;
          all.push(m.id);
          // Set-upgrade campaigns and the like are long and mostly class-specific: opt-in, unless a class is chosen.
          if (m.st && !state.cls) return;
          if (sec.key === 'before' || sec.key === 'inside' || sec.key === 'after' || (sec.key === 'class' && state.cls)) main.push(m.id);
        });
      });
      return { main: main, all: all, first: v.lists.before.map(function (m) { return m.id; }) };
    }
    /* The chains on screen right now, as given and as drawn. Lets tests check the pictures against the facts. */
    function chainsOnScreen() {
      var out = { page: [], sheet: [] };
      function pair(c) { return { full: c, drawn: drawn(c) }; }
      if (state.route.view === 'dungeon' && !state.search.trim()) {
        var slug = state.route.slug, t = mapTargets(core.dungeonView(slug, sess().P, state.wing[slug] || ''));
        out.page = chains(state.mapAll[slug] ? t.all : t.main, t.first).map(pair);
      }
      if (state.sheet && core.quest(state.sheet)) out.sheet = chains([state.sheet]).map(pair);
      return out;
    }

    /* ---- views ---- */
    function rangeBar(d) {
      var lo = 10, span = 50;
      function pct(v) { return Math.max(0, Math.min(100, (v - lo) / span * 100)); }
      var bars = (d.wings || [{ name: '', min: d.min, max: d.max }]).map(function (w) {
        return '<i style="left:' + num(pct(w.min)) + '%;width:' + num(Math.max(2, pct(w.max) - pct(w.min))) + '%"></i>';
      }).join('');
      var me = state.level ? '<b style="left:' + num(pct(state.level)) + '%"></b>' : '';
      return '<span class="bar n' + Math.min(4, (d.wings || [1]).length) + '" aria-hidden="true">' + bars + me + '</span>';
    }

    function homeView() {
      var lvl = state.level;
      var rows = core.dungeons.slice().sort(function (a, b) { return a.min - b.min || a.max - b.max; });
      var inRange = rows.filter(function (d) { return core.rangeState(d, lvl) === 'in'; });
      var shown = state.homeFilter === 'range' && lvl ? inRange : rows;
      var who = { faction: state.faction, cls: state.cls };
      var head = '<section class="hero"><h1>Which dungeon tonight?</h1>';
      if (!lvl) {
        head += '<p>Set your faction, level and class above. The ladder then marks the dungeons in your range. Each one shows how many quests it has for your faction and class; open it for the details.</p>';
      } else if (inRange.length) {
        head += '<p>At level ' + lvl + ' you are in the recommended range for <b>' + esc(listText(inRange.map(function (d) { return d.name; }))) + '</b>.</p>';
      } else {
        head += '<p>No dungeon lists level ' + lvl + ' in its recommended range. The nearest ones are marked below.</p>';
      }
      head += '<div class="seg" role="group" aria-label="Which dungeons to list">' +
        '<button type="button" class="seg-b" data-act="home-filter" data-v="all" data-fk="hf-all" aria-pressed="' + (state.homeFilter !== 'range') + '">All ' + rows.length + '</button>' +
        '<button type="button" class="seg-b" data-act="home-filter" data-v="range" data-fk="hf-range" aria-pressed="' + (state.homeFilter === 'range') + '"' + (lvl ? '' : ' disabled') + '>In my range' + (lvl ? ' (' + inRange.length + ')' : '') + '</button>' +
        '</div></section>';
      var list = shown.map(function (d) {
        var rs = core.rangeState(d, lvl);
        var tag = rs === 'in' ? '<span class="chip ok">In range</span>'
          : rs === 'low' ? '<span class="chip">' + plural(d.min - lvl, 'level') + ' to go</span>'
          : rs === 'high' ? '<span class="chip dimchip">Outlevelled</span>' : '';
        var qline = plural(core.questTotal(d, who), 'quest') + ' total';
        var wings = d.wings ? '<span class="d-wings">' + d.wings.map(function (w) { return esc(w.name) + ' ' + w.min + '–' + w.max; }).join(' · ') + '</span>' : '';
        return '<li class="d r-' + rs + '"><a href="#/d/' + d.slug + '" data-fk="d-' + d.slug + '">' +
          '<span class="d-lv">' + d.min + '–' + d.max + '</span>' +
          '<span class="d-main"><span class="d-name">' + esc(d.name) + (d.isNew ? ' <span class="chip new">New in Forever</span>' : '') + tag + '</span>' +
          '<span class="d-zone">' + esc(d.zone) + '</span>' + wings + rangeBar(d) +
          '<span class="d-q">' + qline + '</span></span></a></li>';
      }).join('');
      return head + '<ol class="ladder" aria-label="Dungeons by recommended level">' + list + '</ol>' +
        '<p class="fine">Level ranges are recommendations, not entry rules. Quests have their own pick-up levels, shown on each quest.</p>';
    }

    function pinsHtml(d) {
      if (!d.pins) return '';
      return '<ul class="pins">' + d.pins.map(function (p, i) {
        var mine = !p.f || p.f === state.faction;
        return '<li' + (mine ? '' : ' class="other"') + '><b>' + esc(p.label) + '</b> <span class="where">' + esc(p.z) + ' <span class="xy">' + num(p.x) + ', ' + num(p.y) + '</span></span> ' +
          copyBtn({ m: p.m, x: p.x, y: p.y, n: d.pins.length < 2 || p.label.indexOf(d.name) >= 0 ? (d.pins.length < 2 ? d.name : p.label) : d.name + ': ' + p.label }, 'pin' + i) + '</li>';
      }).join('') + '</ul>';
    }

    function groupByZone(members, P) {
      var groups = {}, order = [];
      members.forEach(function (m) {
        var first = core.pickups(core.quest(m.id), P)[0];
        var z = first ? (first.in === 1 ? 'Inside the dungeon' : (first.z || 'Location not documented')) : 'Giver not documented';
        if (!groups[z]) { groups[z] = []; order.push(z); }
        groups[z].push(m);
      });
      order.sort(function (a, b) { return groups[b].length - groups[a].length || a.localeCompare(b); });
      return order.map(function (z) { return { zone: z, members: groups[z] }; });
    }

    function sectionHtml(sec, members, d) {
      if (!members.length) return '';
      var key = d.slug + ':' + sec.key;
      var open = state.open[key] != null ? state.open[key] : (sec.open || (sec.key === 'class' && !!state.cls));
      var body;
      var sorted = members.slice().sort(function (a, b) { return title(a.id).localeCompare(title(b.id)) || a.id - b.id; });
      if (sec.key === 'before') {
        body = groupByZone(sorted, sess().P).map(function (g) {
          return '<h4 class="zone">' + esc(g.zone) + ' <span class="dim">' + g.members.length + '</span></h4><ul class="qs">' +
            g.members.map(function (m) { return questRow(m.id, m, d, sec.key); }).join('') + '</ul>';
        }).join('');
      } else {
        body = '<ul class="qs">' + sorted.map(function (m) { return questRow(m.id, m, d, sec.key); }).join('') + '</ul>';
      }
      return '<details class="sec sec-' + sec.key + '" data-key="' + esc(key) + '"' + (open ? ' open' : '') + '>' +
        '<summary data-fk="s-' + esc(key) + '"><h3>' + sec.title + '</h3><span class="count">' + members.length + '</span></summary>' +
        '<p class="blurb">' + sec.blurb + '</p>' + body + '</details>';
    }

    function dungeonViewHtml() {
      var slug = state.route.slug, wing = state.wing[slug] || '';
      var v = core.dungeonView(slug, sess().P, wing), d = v.d, Sx = sess();
      var sm = core.summary(d, Sx), rs = core.rangeState(d, state.level);
      var h = '<nav class="crumb"><a href="#/" data-fk="back">← All dungeons</a></nav>';
      h += '<header class="dh"><h1>' + esc(d.name) + (d.isNew ? ' <span class="chip new">New in Forever</span>' : '') + '</h1>' +
        '<p class="dh-meta">' + esc(d.zone) + ' · recommended level <b>' + d.min + '–' + d.max + '</b>' +
        (rs === 'in' ? ' <span class="chip ok">In range at ' + state.level + '</span>' : rs === 'low' ? ' <span class="chip">' + plural(d.min - state.level, 'level') + ' to go</span>' : rs === 'high' ? ' <span class="chip dimchip">Outlevelled at ' + state.level + '</span>' : '') + '</p>';
      if (d.wings) {
        h += '<div class="wings" role="group" aria-label="Filter quests by wing">' +
          '<button type="button" class="wing-b" data-act="wing" data-slug="' + slug + '" data-v="" data-fk="w-all" aria-pressed="' + (!wing) + '">All wings</button>' +
          d.wings.map(function (w) {
            var tok = core.wingToken(w.name);
            return '<button type="button" class="wing-b" data-act="wing" data-slug="' + slug + '" data-v="' + esc(tok) + '" data-fk="w-' + esc(tok) + '" aria-pressed="' + (wing === tok) + '">' + esc(w.name) + ' <small>' + w.min + '–' + w.max + '</small></button>';
          }).join('') + '</div>';
      }
      h += '</header>';
      h += '<section class="enter"><h2>Getting in</h2><p>' + esc(d.enter) + '</p>' + pinsHtml(d) + '</section>';
      if (d.notes) h += '<ul class="notes">' + d.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';

      var before = v.lists.before;
      if (sm.total) {
        var bits = [];
        if (sm.ready) bits.push('<b>' + sm.ready + '</b> ready to pick up');
        if (sm.waiting) bits.push('<b>' + sm.waiting + '</b> ' + (sm.waiting === 1 ? 'needs' : 'need') + ' earlier quests');
        if (sm.level) bits.push('<b>' + sm.level + '</b> above your level');
        if (sm.active) bits.push('<b>' + sm.active + '</b> in your log');
        if (sm.done) bits.push('<b>' + sm.done + '</b> done');
        h += '<p class="tally">' + plural(sm.total, 'quest') + ' to bring as ' + SIDE_NAME[state.faction] + (state.cls ? ' ' + esc(state.cls) : '') + ': ' + bits.join(', ') + '.</p>';
      } else {
        h += '<p class="tally">Nothing to pick up beforehand as ' + SIDE_NAME[state.faction] + '. Check the lists below for quests that start inside.</p>';
      }

      var mapAll = !!state.mapAll[slug], mt = mapTargets(v);
      var maps = chainMaps(mapAll ? mt.all : mt.main, slug, mt.first);
      var hasMore = mt.all.length > mt.main.length;

      h += sectionHtml(SECTIONS[0], before, d);
      if (maps.count || hasMore) {
        var mk = slug + ':maps', mopen = state.open[mk] != null ? state.open[mk] : true;
        h += '<details class="sec maps" data-key="' + esc(mk) + '"' + (mopen ? ' open' : '') + '>' +
          '<summary data-fk="s-' + esc(mk) + '"><h3>Chain map</h3><span class="count">' + maps.count + '</span></summary><div class="maps-b">' +
          (maps.count ? '<p class="blurb">Earlier work, top to bottom. Quests that share steps share one map, so nothing is listed twice. Tap any box for details.</p>' + legend()
            : '<p class="blurb">None of the main quests here need earlier work.</p>') +
          (hasMore ? '<button type="button" class="link-b" data-act="map-all" data-slug="' + slug + '" data-fk="mapall" aria-pressed="' + mapAll + '">' + (mapAll ? 'Show main quests only' : 'Include class, optional and related chains') + '</button>' : '') +
          maps.html + '</div></details>';
      }
      for (var i = 1; i < SECTIONS.length; i++) h += sectionHtml(SECTIONS[i], v.lists[SECTIONS[i].key], d);
      if (d.src) {
        h += '<details class="srcs"><summary data-fk="dsrc">Guides used for this dungeon</summary><ul>' +
          d.src.map(function (s) { return '<li><a href="' + esc(s[1]) + '" rel="noopener noreferrer" target="_blank">' + esc(s[0]) + '</a></li>'; }).join('') + '</ul></details>';
      }
      return h;
    }

    function searchView() {
      var r = core.search(state.search, 60), Sx = sess();
      var h = '<section class="hero"><h1>Search</h1><p>' + (r.quests.length + r.dungeons.length ? 'Matches for “' + esc(state.search) + '”.' : 'Nothing matches “' + esc(state.search) + '”. Try part of a quest name, a giver or a quest ID.') +
        ' <button type="button" class="link-b" data-act="clear-search" data-fk="clr">Clear search</button></p></section>';
      if (r.dungeons.length) {
        h += '<h2 class="sh">Dungeons</h2><ul class="hits">' + r.dungeons.map(function (d) {
          return '<li><a href="#/d/' + d.slug + '">' + esc(d.name) + '</a> <span class="dim">' + esc(d.zone) + ' · ' + d.min + '–' + d.max + '</span></li>';
        }).join('') + '</ul>';
      }
      if (r.quests.length) {
        h += '<h2 class="sh">Quests</h2><ul class="qs">' + r.quests.map(function (id) {
          var q = core.quest(id), g = Sx.gate(id);
          var where = core.member(id).map(function (x) { return core.dungeon(x.slug).name; }).filter(function (n, i, a) { return a.indexOf(n) === i; });
          return '<li class="q st-' + g.state + '">' + cycleBtn(id, 'sr' + id + 't') + '<div class="q-body"><div class="q-head">' +
            '<a class="q-title" href="' + questHref(id) + '" data-fk="sr' + id + 'a">' + esc(q.t) + '</a>' + partChip(id) + sideChip(q) +
            (q.c ? '<span class="chip cls">' + esc(q.c.join(' / ')) + '</span>' : '') + '<span class="chip id">#' + id + '</span></div>' +
            '<div class="q-where dim">' + esc(where.join(', ')) + '</div></div></li>';
        }).join('') + '</ul>';
        if (r.more) h += '<p class="fine">' + r.more + ' more matches. Add another word to narrow it down.</p>';
      }
      return h;
    }

    function aboutView() {
      var c = DATA.counts;
      return '<nav class="crumb"><a href="#/" data-fk="back">← All dungeons</a></nav>' +
        '<article class="about"><h1>How to read this fieldbook</h1>' +
        '<h2>Levels</h2><p>A dungeon\'s range is the level band where the run is worth doing. It is not a door check. Each quest has two numbers of its own: its <b>quest level</b>, and the <b>level you can pick it up</b>. Where the pick-up level is missing, nobody has published it; that does not mean level 1.</p>' +
        '<h2>Marking progress</h2><p>The round button on every quest cycles through <b>not started</b>, <b>in your log</b> and <b>done</b>. The fieldbook uses that to tell you what is ready and what still needs earlier work. A few quests are only offered while another quest is still in your log, which is why "in your log" and "done" are kept apart. Progress is saved in this browser only.</p>' +
        '<h2>Chain maps</h2><p>Each map reads top to bottom. A solid line is a quest you must finish first. Where several lines meet, the box says whether you need all of them or any one. Dotted lines are optional lead-ins you can skip. A line is left out when a longer route on the same map already covers it; open the box to see everything it needs.</p>' + legend() +
        '<h2>Waypoints</h2><p><b>Copy /way</b> puts a TomTom command on your clipboard, for example <code>/way #1436 52.5 53.1 Alba Fairmoon</code>. Paste it in chat with the TomTom addon installed. Where a spot has no reliable coordinates the fieldbook says so instead of guessing.</p>' +
        '<h2>How sure is all this?</h2><p>It is compiled from published quest databases and player guides for ' + c.quests + ' quests across ' + c.dungeons + ' dungeons, not from playing every chain on a live realm. Where sources disagree in a way that changes what you should do, the quest says so. If the game tells you something different, believe the game.</p>' +
        '<h2>Back up or move your progress</h2><p>Copy the text below to another device, or paste a saved copy here and press Restore.</p>' +
        '<textarea id="backup" class="backup" rows="4" spellcheck="false" aria-label="Progress backup text">' + esc(JSON.stringify(snapshot())) + '</textarea>' +
        '<p class="row"><button type="button" class="btn" data-act="copy-backup" data-fk="bk-copy">Copy backup</button> ' +
        '<button type="button" class="btn" data-act="import" data-fk="bk-imp">Restore from text</button> ' +
        '<button type="button" class="btn danger" data-act="reset" data-fk="bk-reset">Clear all progress</button></p>' +
        '<h2>Sources</h2><ul>' + DATA.about.sources.map(function (s) { return '<li><a href="' + esc(s[1]) + '" rel="noopener noreferrer" target="_blank">' + esc(s[0]) + '</a></li>'; }).join('') + '</ul>' +
        '<p class="fine">' + esc(DATA.about.license) + ' Every quest also links its own pages under "Sources".</p></article>';
    }

    /* ---- quest sheet ---- */
    function reqList(label, ids, test, note) {
      if (!ids || !ids.length) return '';
      return '<div class="req"><h4>' + label + '</h4>' + (note ? '<p class="dim">' + note + '</p>' : '') + '<ul>' + ids.map(function (id) {
        var ok = test(id), q = core.quest(id);
        return '<li class="' + (ok ? 'ok' : 'no') + '"><span class="rq-mark" aria-hidden="true">' + (ok ? '✓' : '○') + '</span>' + qlink(id) +
          (q && q.c ? ' <span class="chip cls">' + esc(q.c.join(' / ')) + '</span>' : '') + (q && q.f && q.f !== 'B' && q.f !== state.faction ? ' ' + sideChip(q) : '') +
          '<span class="vh">' + (ok ? ' (done)' : ' (not done)') + '</span></li>';
      }).join('') + '</ul></div>';
    }

    function sheetHtml() {
      var id = state.sheet, q = core.quest(id);
      if (!q) return '';
      var Sx = sess(), P = Sx.P, g = Sx.gate(id), st = state.progress[id] || 0;
      function done(x) { return Sx.prog(x) === 2; }
      var h = '<div class="sheet-bg" data-act="close-sheet"></div>' +
        '<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheet-t">' +
        '<div class="sheet-h"><div><h2 id="sheet-t" tabindex="-1">' + esc(q.t) + '</h2>' +
        '<p class="sheet-sub">' + partChip(id) + sideChip(q) + (q.c ? '<span class="chip cls">' + esc(q.c.join(' / ')) + ' only</span>' : '') +
        (q.cu ? '<span class="chip warn">Class limits unknown</span>' : '') + '<span class="chip id">Quest #' + id + '</span>' + (q.rep ? '<span class="chip">Repeatable</span>' : '') + '</p></div>' +
        '<button type="button" class="x" data-act="close-sheet" data-fk="sheet-x" aria-label="Close quest details">×</button></div>' +
        '<div class="sheet-b">';
      if (q.al && q.al.length) h += '<p class="dim">Also written as ' + q.al.map(function (a) { return '“' + esc(a) + '”'; }).join(', ') + '.</p>';
      if (q.race) h += '<p class="warnline">' + esc(q.race) + '</p>';

      h += '<div class="seg prog" role="group" aria-label="Your progress on this quest">' +
        ['Not started', 'In my log', 'Done'].map(function (t, v) {
          return '<button type="button" class="seg-b" data-act="set-prog" data-id="' + id + '" data-v="' + v + '" data-fk="sp' + v + '" aria-pressed="' + (st === v) + '">' + t + '</button>';
        }).join('') + '</div>';
      h += '<p class="gate st-' + g.state + '"><span class="dot" aria-hidden="true"></span>' + esc(gateText(id, g)) + '</p>';

      // levels
      var lv = [];
      if (q.lv != null) lv.push('<div><dt>Quest level</dt><dd>' + q.lv + '</dd></div>');
      var pick;
      if (q.min == null) pick = '<span class="dim">not documented</span>';
      else {
        pick = String(q.min);
        if (q.minAlt) pick += ' <span class="dim">(other sources say ' + listText(q.minAlt.map(String), 'or') + ')</span>';
      }
      lv.push('<div><dt>Pick up from level</dt><dd>' + pick + '</dd></div>');
      if (q.pmin != null) lv.push('<div><dt>In practice</dt><dd>around level ' + q.pmin + '</dd></div>');
      if (q.lb != null) lv.push('<div><dt>Earliest through its chain</dt><dd>level ' + q.lb + '</dd></div>');
      h += '<dl class="facts">' + lv.join('') + '</dl>';

      if (q.tip) h += '<p class="tip">' + esc(q.tip) + '</p>';

      // where
      var from = core.pickups(q, P), to = q.to || [];
      h += '<section><h3>Where</h3>';
      if (q.start) h += '<p>Starts from the item <b>' + esc(q.start.join(', ')) + '</b>. You need it in your bags before the quest appears.</p>';
      if (from.length) {
        var itemOnly = from.every(function (l) { return l.k === 'item'; });
        if (!(itemOnly && q.start)) {
          h += '<p class="lbl">' + (from.length > 1 ? 'Pick up from any of' : 'Pick up from') + '</p><ul class="locs">' + from.map(function (l, i) {
            return '<li>' + locHtml(l, 'sf' + i) + (l.note ? '<span class="lnote">' + esc(l.note) + '</span>' : '') + '</li>';
          }).join('') + '</ul>';
        } else {
          from.forEach(function (l) { if (l.note) h += '<p class="lnote">' + esc(l.note) + '</p>'; if (l.in === 1) h += '<p class="dim">The item is found inside ' + esc(l.z) + '.</p>'; });
        }
      } else if (!q.start) {
        h += '<p class="dim">Nobody has documented who or what starts this quest.</p>';
      }
      if (q.cq) h += '<p class="warnline">Guides disagree about the contact for this quest. Trust your quest log.</p>';
      if (to.length) {
        if (to.length === 1 && from.length === 1 && sameLoc(from[0], to[0])) h += '<p class="lbl">Hand in to the same ' + (to[0].k === 'object' ? 'object' : 'person') + '.</p>';
        else h += '<p class="lbl">' + (to.length > 1 ? 'Hand in to any of' : 'Hand in to') + '</p><ul class="locs">' + to.map(function (l, i) {
          return '<li>' + locHtml(l, 'st' + i) + (l.note ? '<span class="lnote">' + esc(l.note) + '</span>' : '') + '</li>';
        }).join('') + '</ul>';
      } else {
        h += '<p class="dim">Hand-in not documented.</p>';
      }
      h += '</section>';

      // what
      if (q.ot || q.obj || q.steps || q.given) {
        h += '<section><h3>What to do</h3>';
        if (q.ot) h += '<p>' + esc(q.ot) + '</p>';
        if (q.obj) h += '<ul class="objs">' + q.obj.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>';
        if (q.given) h += '<p class="dim">Given to you on accepting: ' + esc(q.given.join(', ')) + '.</p>';
        if (q.steps) h += '<ol class="steps">' + q.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>';
        h += '</section>';
      }
      if (q.cond) h += '<section><h3>Conditions</h3><ul class="objs">' + q.cond.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></section>';

      // requirements
      var hasReq = q.all || q.any || q.act || q.doc || q.bc || q.x || q.mf || q.mat || q.altFor;
      h += '<section><h3>Before you can take it</h3>';
      if (!hasReq) h += '<p class="dim">' + (q.ru ? 'Earlier requirements are not documented for this quest. It may still have some.' : 'No earlier quests on record.') + '</p>';
      h += reqList(q.all && q.all.length > 1 ? 'Finish all of these' : 'Finish this first', q.all, done);
      h += reqList(q.any && q.any.length > 1 ? 'Finish any one of these' : 'Finish this first', q.any, done, q.any && q.any.length > 1 ? 'One is enough. They are usually the versions for different classes, races or factions.' : '');
      h += reqList('Have this in your log, not handed in', q.act, function (x) { return Sx.prog(x) === 1; }, 'This quest is only offered while the other one is still active.');
      h += reqList('Guides say do these first', q.doc, done, 'Recommended order from guides. The game may not strictly check it.');
      h += reqList('Optional lead-in', q.bc, done, 'Points you here, but you can skip it.');
      if (q.mf) h += '<p>A side job for ' + qlink(q.mf) + '. Do it while that quest is in your log; it produces something that quest needs.</p>';
      if (q.mat) h += '<p>Side jobs that produce materials for this quest: ' + q.mat.map(function (x) { return qlink(x); }).join(', ') + '. Do them while this quest is in your log, before handing it in.</p>';
      if (q.altFor) h += '<p>Reported as one of several lead-ins to ' + qlink(q.altFor) + '. Which of them the game insists on is not documented.</p>';
      if (q.x) h += '<p class="warnline">Pick one: taking this locks you out of ' + q.x.map(function (x) { return qlink(x); }).join(', ') + '.</p>';
      var plan = Sx.plan(id);
      if (plan.length > 2 && st === 0) {
        h += '<div class="req"><h4>Shortest route from where you are (' + plural(plan.length - 1, 'step') + ' before this)</h4><ol class="route">' +
          plan.slice(0, -1).map(function (x) { return '<li>' + qlink(x) + '</li>'; }).join('') + '</ol>' +
          '<button type="button" class="btn" data-act="mark-earlier" data-id="' + id + '" data-fk="me">I have done all of these already</button></div>';
      }
      var next = core.edgesOut(id).filter(function (e) { return e.type !== 'bc' && e.type !== 'alt' && core.eligible(core.quest(e.to), P); });
      if (next.length) {
        h += '<div class="req"><h4>Opens up</h4><ul>' + next.slice(0, 12).map(function (e) {
          var nq = core.quest(e.to);
          return '<li><span class="rq-mark" aria-hidden="true">→</span>' + qlink(e.to) + (nq.c ? ' <span class="chip cls">' + esc(nq.c.join(' / ')) + '</span>' : '') + '</li>';
        }).join('') + (next.length > 12 ? '<li class="dim">and ' + (next.length - 12) + ' more</li>' : '') + '</ul></div>';
      }
      h += '</section>';

      // map
      var mini = chainMaps([id], null);
      if (mini.count) h += '<section><h3>Chain map</h3>' + legend('this quest') + mini.html + '</section>';

      // dungeons
      var mem = core.member(id);
      if (mem.length) {
        var seen = {};
        h += '<section><h3>Dungeons</h3><ul class="objs">' + mem.filter(function (x) { if (seen[x.slug]) return false; seen[x.slug] = 1; return true; }).map(function (x) {
          var label = { before: 'pick up before the run', inside: 'starts inside', after: 'after the run', class: 'class quest', profession: 'profession quest', event: 'event', raid: 'raid chain', loose: 'objective here', leadin: 'related step', unconfirmed: 'unconfirmed', chain: 'earlier step in a chain' }[x.s];
          return '<li><a href="#/d/' + x.slug + '">' + esc(core.dungeon(x.slug).name) + '</a> <span class="dim">' + label + (x.m && x.m.w ? ' · ' + esc(wingLabel(x.m.w)) : '') + '</span></li>';
        }).join('') + '</ul></section>';
      }
      if (q.src) {
        h += '<details class="srcs"><summary data-fk="qsrc">Sources</summary><ul>' + q.src.map(function (s) {
          var u = core.srcUrl(s), bits = u.replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').split('/').filter(Boolean);
          var tail = bits.length > 1 ? ' · ' + bits[bits.length - 1].replace(/-/g, ' ') : '';
          return '<li><a href="' + esc(u) + '" rel="noopener noreferrer" target="_blank">' + esc(bits[0] + tail) + '</a></li>';
        }).join('') + '</ul></details>';
      }
      return h + '</div></div>';
    }

    function mainHtml() {
      if (state.search.trim()) return searchView();
      if (state.route.view === 'dungeon') return dungeonViewHtml();
      if (state.route.view === 'about') return aboutView();
      return homeView();
    }
    function pageTitle() {
      var t = 'Forever Dungeon Fieldbook';
      if (state.sheet && core.quest(state.sheet)) return core.quest(state.sheet).t + ' · ' + t;
      if (state.route.view === 'dungeon') return core.dungeon(state.route.slug).name + ' · ' + t;
      return t;
    }

    load();
    return {
      core: core, state: state, dispatch: dispatch, setRoute: setRoute, baseHash: baseHash, questHref: questHref,
      mainHtml: mainHtml, sheetHtml: sheetHtml, pageTitle: pageTitle, snapshot: snapshot, session: sess, maps: chainsOnScreen
    };
  }

  /* ------------------------------------------------------------------ boot */
  var BACKGROUND_SEL = '.skip, #top, #main, .foot';
  var STOP_SEL = 'a[href], button, summary, input, select, textarea, [tabindex="0"]';

  /* Where Tab goes inside the quest sheet. An index of -1 means focus sits on something that is not a
     tab stop, such as the title right after opening: forward goes to the first stop, backward to the last. */
  function nextStop(count, index, back) {
    if (!count) return -1;
    if (index < 0) return back ? count - 1 : 0;
    return (index + (back ? count - 1 : 1)) % count;
  }

  function boot() {
    var doc = global.document, win = global;
    var DATA = JSON.parse(doc.getElementById('fb-data').textContent);
    var storage = null;
    try { storage = win.localStorage; storage.getItem(STORE_KEY); } catch (e) { storage = null; }
    var app = createApp(DATA, { storage: storage });
    var $main = doc.getElementById('main'), $sheet = doc.getElementById('sheet'), $toast = doc.getElementById('toast');
    var $level = doc.getElementById('level'), $cls = doc.getElementById('cls'), $search = doc.getElementById('search');
    var lastFocus = null, sheetWasOpen = false, toastTimer = null, scrollMemo = {};

    CLASSES.forEach(function (c) {
      var o = doc.createElement('option');
      o.value = c; o.textContent = c;
      $cls.appendChild(o);
    });

    function syncControls() {
      var s = app.state;
      Array.prototype.forEach.call(doc.querySelectorAll('#who [data-act="faction"]'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === s.faction));
      });
      if (doc.activeElement !== $level) $level.value = s.level || '';
      $cls.value = s.cls;
      if (doc.activeElement !== $search) $search.value = s.search;
      doc.documentElement.setAttribute('data-side', s.faction);
    }

    function paint(opts) {
      opts = opts || {};
      var active = doc.activeElement, fk = active && active.getAttribute ? active.getAttribute('data-fk') : null;
      var inSheet = active && $sheet.contains(active);
      var scrolls = {};
      Array.prototype.forEach.call(doc.querySelectorAll('.chain-scroll'), function (el, i) { scrolls[i] = el.scrollLeft; });
      var sheetScroll = $sheet.querySelector('.sheet-b');
      var sheetTop = sheetScroll ? sheetScroll.scrollTop : 0;
      if (!opts.sheetOnly) $main.innerHTML = app.mainHtml();
      var open = !!app.state.sheet;
      if (open) {
        $sheet.innerHTML = app.sheetHtml();
        $sheet.hidden = false;
        doc.body.classList.add('locked');
      } else {
        $sheet.hidden = true;
        $sheet.innerHTML = '';
        doc.body.classList.remove('locked');
      }
      // While the sheet is open the page behind it is out of reach for keyboard, pointer and assistive tech.
      setBackgroundInert(open);
      doc.title = app.pageTitle();
      syncControls();
      if (!opts.resetScroll) {
        Array.prototype.forEach.call($main.querySelectorAll('.chain-scroll'), function (el, i) { if (scrolls[i]) el.scrollLeft = scrolls[i]; });
      }
      if (open && sheetWasOpen && opts.sameSheet) {
        var sb = $sheet.querySelector('.sheet-b');
        if (sb) sb.scrollTop = sheetTop;
        if (!refocus(fk, $sheet)) focusSheetTitle();
      } else if (open) {
        focusSheetTitle();
      } else if (sheetWasOpen) {
        if (!refocus(lastFocus, $main)) $main.focus({ preventScroll: true });
      } else if (opts.resetScroll) {
        win.scrollTo(0, 0);
        $main.focus({ preventScroll: true });
      } else if (fk && !inSheet) {
        refocus(fk, $main);
      }
      sheetWasOpen = open;
    }
    function refocus(fk, scope) {
      if (!fk) return false;
      var list = scope.querySelectorAll('[data-fk]');
      for (var i = 0; i < list.length; i++) {
        if (list[i].getAttribute('data-fk') === fk) { list[i].focus({ preventScroll: true }); return true; }
      }
      return false;
    }
    function setBackgroundInert(on) {
      Array.prototype.forEach.call(doc.querySelectorAll(BACKGROUND_SEL), function (el) {
        if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert');
      });
    }
    function focusSheetTitle() {
      var t = doc.getElementById('sheet-t');
      if (t) t.focus({ preventScroll: true });
    }
    /* Tab stops that can really take focus right now: links inside a closed "Sources" fold do not count. */
    function sheetStops() {
      var all = $sheet.querySelectorAll(STOP_SEL), out = [];
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.disabled || (el.getClientRects && !el.getClientRects().length)) continue;
        out.push(el);
      }
      return out;
    }
    function toast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { $toast.classList.remove('on'); }, 2200);
    }
    function copy(text, okMsg) {
      function fallback() {
        // The helper field lives inside the sheet while it is open, so focus never leaves the dialog.
        var host = app.state.sheet ? $sheet : doc.body, back = doc.activeElement;
        var ta = doc.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.setAttribute('aria-hidden', 'true'); ta.style.position = 'fixed'; ta.style.opacity = '0';
        host.appendChild(ta); ta.select();
        var ok = false;
        try { ok = doc.execCommand('copy'); } catch (e) { ok = false; }
        host.removeChild(ta);
        if (back && back.focus) back.focus({ preventScroll: true });
        toast(ok ? okMsg : 'Copy failed. The command is: ' + text);
      }
      if (win.navigator && win.navigator.clipboard && win.navigator.clipboard.writeText) {
        win.navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
      } else fallback();
    }
    function go(hash) {
      if (win.location.hash === hash) onHash(); else win.location.hash = hash;
    }
    function onHash() {
      var before = app.state.sheet;
      if (!before) {
        var a = doc.activeElement;
        lastFocus = a && a.getAttribute ? a.getAttribute('data-fk') : null;
      }
      var fromBase = app.baseHash(), fromY = win.pageYOffset || 0;
      var r = app.setRoute(win.location.hash);
      if (r.viewChanged) scrollMemo[fromBase] = fromY;
      paint({ resetScroll: r.viewChanged });
      // Coming back to the ladder: return to where you were on it.
      if (r.viewChanged && app.baseHash() === '#/' && scrollMemo['#/']) win.scrollTo(0, scrollMemo['#/']);
    }

    doc.addEventListener('click', function (ev) {
      var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!el) return;
      var act = el.getAttribute('data-act');
      if (act === 'copy') { copy(el.getAttribute('data-text'), 'Waypoint copied: ' + el.getAttribute('data-text')); return; }
      if (act === 'close-sheet') { go(app.baseHash()); return; }
      if (act === 'clear-search') { app.dispatch('search', { v: '' }); $search.value = ''; paint({ resetScroll: true }); return; }
      if (act === 'copy-backup') { copy(doc.getElementById('backup').value, 'Backup copied.'); return; }
      if (act === 'import') {
        var res = app.dispatch('import', { text: doc.getElementById('backup').value });
        toast(res.ok ? 'Progress restored.' : 'That text is not a fieldbook backup.');
        paint();
        return;
      }
      if (act === 'reset') {
        if (win.confirm('Clear every quest you have marked? This cannot be undone.')) { app.dispatch('reset'); toast('Progress cleared.'); paint(); }
        return;
      }
      app.dispatch(act, { v: el.getAttribute('data-v'), id: el.getAttribute('data-id'), slug: el.getAttribute('data-slug') });
      paint({ sameSheet: true });
    });
    doc.addEventListener('toggle', function (ev) {
      var el = ev.target;
      if (el && el.matches && el.matches('details.sec')) app.dispatch('toggle', { key: el.getAttribute('data-key'), open: el.open });
    }, true);
    $level.addEventListener('input', function () { app.dispatch('level', { v: $level.value }); paint(); });
    $cls.addEventListener('change', function () { app.dispatch('cls', { v: $cls.value }); paint(); });
    var searchTimer = null;
    $search.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { app.dispatch('search', { v: $search.value }); paint(); }, 120);
    });
    doc.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && app.state.sheet) { ev.preventDefault(); go(app.baseHash()); return; }
      if (ev.key === 'Tab' && app.state.sheet) {
        // Tab order inside the open sheet is driven here in full, so it cannot leak to the page behind:
        // not from the title (focused on open but not itself a tab stop), not past the last stop, not before the first.
        ev.preventDefault();
        var stops = sheetStops();
        var to = nextStop(stops.length, Array.prototype.indexOf.call(stops, doc.activeElement), !!ev.shiftKey);
        if (to < 0) focusSheetTitle(); else stops[to].focus();
        return;
      }
      if (ev.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || '')) && !app.state.sheet) { ev.preventDefault(); $search.focus(); }
    });
    // Belt and braces: if focus still lands behind an open sheet (a script, a browser shortcut), bring it back.
    doc.addEventListener('focusin', function (ev) {
      if (!app.state.sheet || $sheet.hidden) return;
      if (ev.target && ev.target !== doc.body && !$sheet.contains(ev.target)) focusSheetTitle();
    });
    win.addEventListener('hashchange', onHash);
    app.setRoute(win.location.hash);
    paint({ resetScroll: false });
    global.__fieldbook = app;
  }

  var api = { createCore: createCore, layoutGraph: layoutGraph, createApp: createApp, nextStop: nextStop, STOP_SEL: STOP_SEL, BACKGROUND_SEL: BACKGROUND_SEL, CLASSES: CLASSES, SECTIONS: SECTIONS, STORE_KEY: STORE_KEY };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else global.FieldbookApp = api;
  if (global.document && global.document.getElementById && global.document.getElementById('fb-data')) {
    if (global.document.readyState === 'loading') global.document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));

</script>
</body>
