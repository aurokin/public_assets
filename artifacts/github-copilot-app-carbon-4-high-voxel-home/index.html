<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Merge Villa — GitHub Copilot's 3D Voxel Dream Home</title>
  <style>
    :root {
      --bg-glass: rgba(16, 20, 17, 0.72);
      --border-glass: rgba(200, 152, 253, 0.24);
      --text-primary: #F2F5F3;
      --text-muted: #B6BFB8;
      --accent-purple: #8534F3;
      --accent-purple-soft: #C898FD;
      --accent-green: #5FED83;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101411;
      font-family: -apple-system, BlinkMacSystemFont, "Mona Sans", "Segoe UI", system-ui, sans-serif;
      color: var(--text-primary);
    }

    #canvas-root {
      position: fixed;
      inset: 0;
    }

    /* Top-left compact title badge */
    .hud-header {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 11px 15px;
      border-radius: 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
      max-width: 340px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(135deg, #B870FF, #5FED83);
      box-shadow: 0 0 10px rgba(133, 52, 243, 0.8);
      flex-shrink: 0;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .hud-sub {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Top-right mode controls */
    .hud-actions {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }

    button.pill {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }

    button.pill:hover {
      border-color: var(--accent-purple-soft);
      transform: translateY(-1px);
    }

    button.pill.active {
      background: rgba(133, 52, 243, 0.42);
      border-color: var(--accent-purple-soft);
      box-shadow: 0 0 18px rgba(133, 52, 243, 0.35);
    }

    .key-hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-purple-soft);
    }

    /* Bottom room camera bar */
    .hud-bottom {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      width: max-content;
      max-width: calc(100vw - 24px);
    }

    #preset-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .controls-legend {
      font-size: 11px;
      color: rgba(242, 245, 243, 0.68);
      background: rgba(16, 20, 17, 0.52);
      padding: 4px 11px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    /* Interactive POI Inspector Tooltip Card */
    #poi-card {
      position: fixed;
      left: 16px;
      bottom: 84px;
      z-index: 12;
      width: 290px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(16, 20, 17, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(184, 112, 255, 0.45);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    #poi-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #poi-sub {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-green);
      margin-bottom: 3px;
    }

    #poi-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    #poi-desc {
      font-size: 12px;
      line-height: 1.42;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="canvas-root"></div>

  <div class="hud-header">
    <div class="brand-row">
      <span class="brand-dot"></span>
      <span class="hud-title">The Merge Villa — Copilot's Dream Home</span>
    </div>
    <div class="hud-sub" id="voxel-stats">Building custom voxel world…</div>
  </div>

  <div class="hud-actions">
    <button class="pill" id="btn-atmo" title="Shortcut: L">Atmosphere: Golden Dusk</button>
    <button class="pill" id="btn-cutaway" title="Shortcut: C">Cutaway: Full Villa</button>
    <button class="pill" id="btn-orbit" title="Shortcut: Space">Auto-Orbit</button>
    <button class="pill" id="btn-audio">Sound: Muted</button>
  </div>

  <div id="poi-card">
    <div id="poi-sub">Zone</div>
    <div id="poi-title">Title</div>
    <div id="poi-desc">Description</div>
  </div>

  <div class="hud-bottom">
    <div id="preset-bar"></div>
    <div class="controls-legend">
      Drag to orbit • Scroll to zoom • <b>WASD / QE</b> fly • <b>1–7</b> rooms • <b>L</b> lighting • <b>C</b> cutaway • Click highlights to focus
    </div>
  </div>
